name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/vigilant-mendel-j6wlhn

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Export Expo web
        run: npx expo export --platform web

      - name: Fix asset paths for GitHub Pages subpath
        run: |
          # Fix HTML references
          sed -i 's|src="/_expo/|src="/petit_suivi/_expo/|g' dist/index.html
          sed -i 's|href="/_expo/|href="/petit_suivi/_expo/|g' dist/index.html
          sed -i 's|href="/favicon|href="/petit_suivi/favicon|g' dist/index.html
          sed -i 's|href="/assets/|href="/petit_suivi/assets/|g' dist/index.html
          # Fix asset paths inside the JS bundle (fonts, images, etc.)
          find dist/_expo -name "*.js" -exec sed -i 's|"/assets/|"/petit_suivi/assets/|g' {} \;
          # Add viewport-fit=cover so env(safe-area-inset-*) works on mobile
          sed -i 's|<meta name="viewport" content="width=device-width|<meta name="viewport" content="width=device-width, viewport-fit=cover|g' dist/index.html
          # Set lang=fr and disable auto-translation (prevents "Selles" → "Ventes" via Google Translate)
          sed -i 's|<html|<html lang="fr" translate="no"|g' dist/index.html
          sed -i 's|<head>|<head>\n  <meta name="google" content="notranslate">|g' dist/index.html
          # Inject PWA meta tags + manifest link
          sed -i 's|</head>|  <link rel="manifest" href="/petit_suivi/manifest.json">\n  <link rel="apple-touch-icon" href="/petit_suivi/assets/apple-touch-icon.png">\n  <meta name="theme-color" content="#C97B4A">\n  <meta name="mobile-web-app-capable" content="yes">\n  <meta name="apple-mobile-web-app-capable" content="yes">\n  <meta name="apple-mobile-web-app-status-bar-style" content="default">\n  <meta name="apple-mobile-web-app-title" content="Petit Suivi">\n</head>|g' dist/index.html
          # Copy manifest.json
          cp web/manifest.json dist/manifest.json
          # Copy PWA icons (Expo only bundles assets used via require() — icons are not)
          mkdir -p dist/assets
          cp assets/icon-192.png dist/assets/icon-192.png
          cp assets/icon-512.png dist/assets/icon-512.png
          cp assets/apple-touch-icon.png dist/assets/apple-touch-icon.png
          cp assets/favicon.png dist/assets/favicon.png
          echo "--- index.html after fix ---"
          cat dist/index.html

      - name: Disable Jekyll (required for _expo directory)
        run: touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
